name: network-tasks
on:
  workflow_dispatch:
  schedule:
    - cron: "0 1,13 * * *"
permissions:
  contents: read
jobs:
  archive-and-health:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Archive every URL in the live sitemap to web.archive.org
        env:
          BASE: https://dytsk9wrfv.page.coze.site
        run: |
          mapfile -t pages < <(curl -s --max-time 30 "${BASE}/sitemap.xml" \
            | grep -oE 'https://[^<]+\.html' \
            | sed "s#${BASE}/##" | sort -u)
          echo "Discovered ${#pages[@]} pages from sitemap"
          ok=0; fail=0
          for p in "${pages[@]}"; do
            code=$(curl -sL -o /dev/null -w "%{http_code}" --max-time 40 \
              "https://web.archive.org/save/${BASE}/${p}" || echo 000)
            echo "archive ${p} -> ${code}"
            case "${code}" in 200|301|302) ok=$((ok+1));; *) fail=$((fail+1));; esac
            sleep 3
          done
          echo "ARCHIVE SUMMARY ok=${ok} fail=${fail} (failures retry on next run)"
      - name: Health check live site + mirror
        run: |
          for base in https://dytsk9wrfv.page.coze.site https://contentforge-press.github.io; do
            for p in index tools amazon-fba-calculator depop-fee-calculator sales-tax-by-state california-sales-tax-calculator; do
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "${base}/${p}.html")
              echo "health ${base##*/}/${p}.html -> ${code}"
            done
          done
